<!DOCTYPE html>
<html lang="uk">
  <head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20' stroke='%2300a870' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z' stroke='%2300a870' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookShare — Адмінпанель</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .admin-wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

      .admin-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
      .admin-subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

      /* Статистика */
      .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
      .stat-card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); text-align: center; }
      .stat-card .stat-num { font-size: 36px; font-weight: 700; color: #00a870; }
      .stat-card .stat-label { font-size: 13px; color: #888; margin-top: 4px; }

      /* Таби */
      .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
      .admin-tab { padding: 9px 22px; border-radius: 8px; border: 1.5px solid #e0e0e0; background: #fff; font-size: 14px; font-weight: 500; cursor: pointer; color: #555; transition: all .15s; }
      .admin-tab.active { background: #00a870; color: #fff; border-color: #00a870; }

      /* Таблиця */
      .admin-table-wrap { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { background: #f7f8fa; padding: 13px 16px; text-align: left; font-weight: 600; color: #444; border-bottom: 1.5px solid #eee; }
      td { padding: 13px 16px; border-bottom: 1px solid #f0f0f0; color: #333; vertical-align: middle; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #fafafa; }

      .role-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
      .role-admin  { background: #e8f5e9; color: #00a870; }
      .role-user   { background: #f0f0f0; color: #888; }
      .role-banned { background: #fce8e8; color: #e53935; }

      .admin-btn { padding: 5px 14px; border-radius: 7px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
      .admin-btn:hover { opacity: .8; }
      .btn-ban    { background: #fff3e0; color: #e65100; }
      .btn-delete { background: #fce8e8; color: #c62828; }
      .btn-gap    { display: flex; gap: 8px; }

      .admin-section { display: none; }
      .admin-section.active { display: block; }

      .admin-loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
    </style>
  </head>
  <body>

    <header class="navbar">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#00a870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#00a870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        BookShare
      </a>
      <nav>
        <a href="index.html">Головна</a>
        <a href="browse.html">Переглянути книги</a>
        <a href="profile.html">Мої книги</a>
      </nav>
      <div class="nav-right">
        <a href="add-book.html" class="add-book-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          Додати книгу
        </a>
        <button class="profile-icon" aria-label="Профіль">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="admin-wrap">
      <div class="admin-title">Адмінпанель</div>
      <div class="admin-subtitle">Управління користувачами та книгами</div>

      <!-- Статистика -->
      <div class="admin-stats">
        <div class="stat-card">
          <div class="stat-num" id="stat-users">—</div>
          <div class="stat-label">Користувачів</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-books">—</div>
          <div class="stat-label">Книг</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-chats">—</div>
          <div class="stat-label">Чатів</div>
        </div>
      </div>

      <!-- Таби -->
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchTab('users')">👤 Користувачі</button>
        <button class="admin-tab" onclick="switchTab('books')">📚 Книги</button>
      </div>

      <!-- Користувачі -->
      <div class="admin-section active" id="section-users">
        <div class="admin-table-wrap">
          <div class="admin-loading" id="users-loading">Завантаження...</div>
          <table id="users-table" style="display:none">
            <thead>
              <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Дата реєстрації</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Книги -->
      <div class="admin-section" id="section-books">
        <div class="admin-table-wrap">
          <div class="admin-loading" id="books-loading">Завантаження...</div>
          <table id="books-table" style="display:none">
            <thead>
              <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Автор</th>
                <th>Категорія</th>
                <th>Власник</th>
                <th>Дата</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="books-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="js/pages/admin.js"></script>
  </body>
</html>
