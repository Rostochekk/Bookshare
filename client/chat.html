<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookShare — Повідомлення</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="chat-page">

    <!-- =================== НАВІГАЦІЯ =================== -->
    <header class="navbar">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#00a870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#00a870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        BookShare
      </a>
      <nav>
        <a href="index.html">Головна</a>
        <a href="browse.html">Переглянути книги</a>
        <a href="profile.html">Мої книги</a>
      </nav>
      <div class="nav-right">
        <a href="add-book.html" class="add-book-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          Додати книгу
        </a>
        <!-- Кнопка профілю — dropdown ініціалізується в main.js -->
        <button class="profile-icon" aria-label="Профіль">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- =================== ЧАТ =================== -->
    <div class="chat-wrapper">

      <!-- САЙДБАР -->
      <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h2>Повідомлення</h2>
        </div>

        <div class="chat-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="chatSearch" placeholder="Пошук" />
        </div>

        <!-- Чати завантажуються через chat.js -->
        <div class="chat-list" id="chatList"></div>
      </aside>

      <!-- ОБЛАСТЬ ЧАТУ -->
      <section class="chat-area" id="chatArea">

        <!-- Шапка -->
        <div class="chat-area-header">
          <button class="chat-back-btn" onclick="closeChatMobile()" title="Назад">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>

          <img id="chatHeaderAvatar" src="" alt="Аватар" class="chat-area-avatar" />

          <div class="chat-area-user">
            <div class="chat-area-name" id="chatHeaderName">Оберіть чат</div>
            <div class="chat-area-status" id="chatHeaderStatus"></div>
          </div>

          <!-- Book preview — заповнюється JS -->
          <div class="chat-book-preview" id="chatBookPreview" style="display:none;"></div>
        </div>

        <!-- ── Банер рейтингу ── -->
        <div class="chat-rating-banner" id="ratingBanner" style="display:none;">
          <div class="chat-rating-content">
            <p>Як пройшла розмова? Оцініть 😊</p>
            <div class="chat-rating-stars">
              <span class="rating-star" data-value="1">★</span>
              <span class="rating-star" data-value="2">★</span>
              <span class="rating-star" data-value="3">★</span>
              <span class="rating-star" data-value="4">★</span>
              <span class="rating-star" data-value="5">★</span>
            </div>
          </div>
          <button class="chat-rating-close" onclick="dismissRating()" title="Закрити">✕</button>
        </div>

        <!-- Повідомлення -->
        <div class="chat-messages" id="chatMessages">
          <!-- Порожній стан -->
          <div class="chat-loading" style="color:#bbb;text-align:center;margin:auto;">
            Оберіть розмову зі списку
          </div>
        </div>

        <!-- Поле вводу -->
        <div class="chat-input-wrap">
          <!-- Preview обраного фото -->
          <div class="chat-img-preview" id="imgPreviewWrap" style="display:none;">
            <img id="imgPreview" src="" alt="preview" />
            <button id="imgPreviewRemove" title="Видалити">✕</button>
          </div>

          <div class="chat-input-area">
            <!-- Прихований file input -->
            <input type="file" id="msgFileInput" accept="image/*" style="display:none;" />

            <button class="chat-attach-btn" title="Прикріпити фото">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>

            <input type="text" class="chat-input" id="msgInput"
                   placeholder="Написати повідомлення..." />

            <button class="chat-send-btn" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>

      </section>
    </div><!-- /chat-wrapper -->

    <script type="module" src="js/chat.js"></script>
  </body>
</html>
